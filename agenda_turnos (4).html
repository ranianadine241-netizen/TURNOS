<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda tu turno</title>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  CONFIGURACIÓN FIREBASE (necesaria para sincronizar datos)  ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  1. Ve a https://console.firebase.google.com                ║
  ║  2. Crea un proyecto nuevo (gratis)                         ║
  ║  3. Haz clic en "Realtime Database" → Crear base de datos  ║
  ║     → Elige modo de prueba (permite lectura/escritura)      ║
  ║  4. En "Configuración del proyecto" → Tus apps →           ║
  ║     Agrega app web (</>)                                    ║
  ║  5. Copia los valores de firebaseConfig y pégalos abajo     ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ▼▼▼ PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyCW0abR0KUX9LYhNluxNJZPlBXEHMVnlqA",
    authDomain: "hr-team-51648.firebaseapp.com",
    databaseURL: "https://hr-team-51648-default-rtdb.firebaseio.com",
    projectId: "hr-team-51648",
    storageBucket: "hr-team-51648.firebasestorage.app",
    messagingSenderId: "809856788088",
    appId: "1:809856788088:web:98a697ba0504a53636ef8d"
  };
  // ▲▲▲ FIN DE CONFIGURACIÓN ▲▲▲

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, "turnos");

  const SLOTS = [
    "9:00 – 9:15","9:15 – 9:30","9:30 – 9:45","9:45 – 10:00",
    "10:00 – 10:15","10:15 – 10:30","10:30 – 10:45","10:45 – 11:00",
    "11:00 – 11:15","11:15 – 11:30","11:30 – 11:45","11:45 – 12:00",
    "12:00 – 12:15","12:15 – 12:30","12:30 – 12:45","12:45 – 1:00"
  ];

  const ADMIN_PASS = "admin2024";
  let regs = {};
  let selSlot = null;
  let mySlot = null;
  let adminOpen = false;
  let adminAuth = false;

  // Escucha cambios en tiempo real
  onValue(dbRef, (snapshot) => {
    regs = snapshot.val() || {};
    renderSlots();
    if (adminAuth) renderAdmin();
  });

  function renderSlots() {
    const grid = document.getElementById("slotsGrid");
    const name = document.getElementById("nameInput").value.trim();
    grid.innerHTML = "";
    SLOTS.forEach(s => {
      const key = s.replace(/[^a-z0-9]/gi, "_");
      const taken = !!regs[key];
      const btn = document.createElement("button");
      btn.className = "slot" + (taken ? " taken" : "") + (selSlot === s ? " sel" : "");
      btn.disabled = taken || !name;
      btn.textContent = taken ? s + " ✓" : s;
      if (!taken && name) btn.onclick = () => { selSlot = s; renderSlots(); updateConfirm(); };
      grid.appendChild(btn);
    });
  }

  function updateConfirm() {
    const name = document.getElementById("nameInput").value.trim();
    document.getElementById("confirmBtn").disabled = !name || !selSlot;
  }

  document.getElementById("nameInput").addEventListener("input", () => {
    if (!document.getElementById("nameInput").value.trim()) selSlot = null;
    renderSlots();
    updateConfirm();
  });

  window.confirmSlot = async function () {
    const name = document.getElementById("nameInput").value.trim();
    if (!name || !selSlot) return;
    const btn = document.getElementById("confirmBtn");
    btn.disabled = true;
    btn.textContent = "Registrando...";
    try {
      const snap = await get(dbRef);
      const cur = snap.val() || {};
      if (cur[selSlot]) {
        regs = cur;
        selSlot = null;
        renderSlots();
        btn.textContent = "Confirmar turno";
        return;
      }
      const slotKey = selSlot.replace(/[^a-z0-9]/gi, "_");
      cur[slotKey] = { label: selSlot, name, time: new Date().toLocaleString("es-PE") };
      await set(dbRef, cur);
      regs = cur;
      mySlot = slotKey;
      document.getElementById("form-card").classList.add("hidden");
      document.getElementById("success-card").classList.remove("hidden");
      document.getElementById("s-name").textContent = name;
      document.getElementById("s-slot").textContent = selSlot;
    } catch (e) { console.error(e); }
    btn.textContent = "Confirmar turno";
  };

  window.resetForm = function () {
    document.getElementById("success-card").classList.add("hidden");
    document.getElementById("form-card").classList.remove("hidden");
    document.getElementById("nameInput").value = "";
    document.getElementById("cancel-box").classList.add("hidden");
    selSlot = null; mySlot = null;
    renderSlots(); updateConfirm();
  };

  window.showCancelConfirm = () => document.getElementById("cancel-box").classList.remove("hidden");
  window.hideCancelConfirm = () => document.getElementById("cancel-box").classList.add("hidden");

  window.cancelSlot = async function () {
    if (!mySlot) return;
    try {
      const snap = await get(dbRef);
      const cur = snap.val() || {};
      delete cur[mySlot];
      await set(dbRef, cur);
      regs = cur;
    } catch (e) { console.error(e); }
    resetForm();
  };

  window.toggleAdmin = function () {
    adminOpen = !adminOpen;
    if (!adminOpen) {
      document.getElementById("admin-login").classList.add("hidden");
      document.getElementById("admin-panel").classList.add("hidden");
      adminAuth = false;
      document.getElementById("pwdInput").value = "";
      return;
    }
    if (adminAuth) { document.getElementById("admin-panel").classList.remove("hidden"); renderAdmin(); }
    else document.getElementById("admin-login").classList.remove("hidden");
  };

  window.adminLogin = function () {
    if (document.getElementById("pwdInput").value === ADMIN_PASS) {
      adminAuth = true;
      document.getElementById("admin-login").classList.add("hidden");
      document.getElementById("pwd-err").classList.add("hidden");
      document.getElementById("admin-panel").classList.remove("hidden");
      renderAdmin();
    } else {
      document.getElementById("pwd-err").classList.remove("hidden");
    }
  };

  function renderAdmin() {
    const taken = Object.keys(regs).length;
    document.getElementById("stats-row").innerHTML = `
      <div class="stat"><div class="stat-n">${taken}</div><div class="stat-l">Reservados</div></div>
      <div class="stat"><div class="stat-n">${SLOTS.length - taken}</div><div class="stat-l">Disponibles</div></div>
      <div class="stat"><div class="stat-n">${SLOTS.length}</div><div class="stat-l">Total</div></div>`;
    const tb = document.getElementById("adminTable");
    tb.innerHTML = "";
    SLOTS.forEach((s, i) => {
      const key = s.replace(/[^a-z0-9]/gi, "_");
      const r = regs[key];
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="color:#a89880;font-size:.72rem">${i + 1}</td>
        <td>${s}</td>
        <td>${r ? r.name : '<span style="color:#c0b49e">—</span>'}</td>
        <td><span class="badge ${r ? "b-taken" : "b-free"}">${r ? "Reservado" : "Libre"}</span></td>
        <td style="text-align:right">${r ? `<button class="del-btn" onclick="adminDelete('${key}')">Liberar</button>` : ""}</td>`;
      tb.appendChild(tr);
    });
  }

  window.adminDelete = async function (key) {
    try {
      const snap = await get(dbRef);
      const cur = snap.val() || {};
      delete cur[key];
      await set(dbRef, cur);
      regs = cur;
    } catch (e) { console.error(e); }
    renderSlots(); renderAdmin();
  };

  document.getElementById("pwdInput").addEventListener("keydown", e => {
    if (e.key === "Enter") adminLogin();
  });
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #faf8f4; padding: 2rem 1rem 4rem; min-height: 100vh; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; color: #1a1410; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
  .sub { color: #7a6f62; font-size: 0.88rem; font-weight: 300; }
  .header { text-align: center; margin-bottom: 2rem; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #e8e2d8; padding: 1.6rem; max-width: 520px; margin: 0 auto 1.2rem; }
  .label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #a89880; margin-bottom: 0.75rem; display: block; }
  input[type=text], input[type=password] { width: 100%; padding: 0.65rem 1rem; border: 1px solid #e0d9cc; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.93rem; color: #1a1410; background: #faf8f4; outline: none; margin-bottom: 1rem; transition: border-color .15s; }
  input:focus { border-color: #c4a97a; background: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 1.1rem; }
  .slot { padding: 0.55rem 0.4rem; border-radius: 8px; border: 1px solid #e0d9cc; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; background: #fff; color: #1a1410; transition: all .12s; text-align: center; }
  .slot:hover:not(:disabled) { border-color: #c4a97a; background: #fdf5e8; color: #8b5c1a; }
  .slot.sel { background: #c4a97a; border-color: #c4a97a; color: #fff; font-weight: 500; }
  .slot:disabled { background: #f0ece4; color: #c0b49e; cursor: not-allowed; border-color: #e8e2d8; font-size: .76rem; }
  .btn { width: 100%; padding: 0.75rem; background: #1a1410; color: #fff; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; font-weight: 500; cursor: pointer; transition: background .15s; }
  .btn:hover:not(:disabled) { background: #2d2520; }
  .btn:disabled { background: #c0b49e; cursor: not-allowed; }
  .btn-gold { background: #c4a97a; }
  .btn-gold:hover:not(:disabled) { background: #b5996b; }
  .btn-red { background: #fff; color: #b03030; border: 1px solid #f0c0c0; margin-top: 0.5rem; }
  .btn-red:hover:not(:disabled) { background: #fff5f5; }
  .btn-outline { background: #fff; color: #1a1410; border: 1px solid #e0d9cc; }
  .btn-outline:hover:not(:disabled) { background: #faf8f4; }
  .success { background: #f0f7ec; border: 1px solid #b8dba8; border-radius: 10px; padding: 1rem 1.2rem; text-align: center; margin-bottom: 1rem; }
  .success .ico { font-size: 1.4rem; margin-bottom: .4rem; }
  .success strong { display: block; font-size: .97rem; color: #2a5020; margin-bottom: .2rem; }
  .success p { color: #3a6b2a; font-size: .87rem; }
  .cancel-box { background: #fff5f5; border: 1px solid #f0c0c0; border-radius: 10px; padding: 1rem 1.2rem; margin-top: .75rem; }
  .cancel-box p { color: #7a2020; font-size: .85rem; margin-bottom: .75rem; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-top: 0; }
  .err { color: #b03030; font-size: .8rem; margin-top: -.5rem; margin-bottom: .75rem; display: none; }
  .stats { display: flex; gap: 10px; margin-bottom: 1.1rem; }
  .stat { flex: 1; background: #faf8f4; border-radius: 8px; padding: .7rem; text-align: center; }
  .stat-n { font-size: 1.35rem; font-weight: 500; color: #1a1410; }
  .stat-l { font-size: .7rem; color: #a89880; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: .83rem; }
  th { text-align: left; padding: .45rem .6rem; background: #faf8f4; color: #7a6f62; font-weight: 500; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #e8e2d8; }
  td { padding: .6rem .6rem; border-bottom: 1px solid #f0ece4; color: #1a1410; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .b-taken { background: #f5f0e8; color: #8b5c1a; }
  .b-free { background: #f0f7ec; color: #3a6b2a; }
  .del-btn { padding: 2px 9px; background: #fff; color: #b03030; border: 1px solid #f0c0c0; border-radius: 6px; font-size: .72rem; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .del-btn:hover { background: #fff5f5; }
  .admin-link { display: block; text-align: center; color: #a89880; font-size: .78rem; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; text-decoration: underline; text-underline-offset: 3px; margin: 0 auto 1rem; }
  .hidden { display: none !important; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>

<div class="header">
  <h1>Agenda tu turno</h1>
  <p class="sub">9:00 a.m. – 1:00 p.m. · Turnos de 15 minutos</p>
</div>

<div class="card" id="form-card">
  <span class="label">Tu nombre</span>
  <input type="text" id="nameInput" placeholder="Escribe tu nombre completo">
  <span class="label">Elige un horario disponible</span>
  <div class="grid" id="slotsGrid"></div>
  <button class="btn" id="confirmBtn" disabled onclick="confirmSlot()">Confirmar turno</button>
</div>

<div class="card hidden" id="success-card">
  <div class="success">
    <div class="ico">🎉</div>
    <strong id="s-name"></strong>
    <p id="s-slot"></p>
  </div>
  <button class="btn btn-gold" onclick="resetForm()">Registrar otro turno</button>
  <button class="btn btn-red" onclick="showCancelConfirm()">Cancelar mi turno</button>
  <div class="cancel-box hidden" id="cancel-box">
    <p>¿Seguro que deseas cancelar? El horario quedará libre para otras personas.</p>
    <div class="btn-row">
      <button class="btn" style="background:#b03030;font-size:.86rem;padding:.6rem" onclick="cancelSlot()">Sí, cancelar</button>
      <button class="btn btn-outline" style="font-size:.86rem;padding:.6rem" onclick="hideCancelConfirm()">No, mantener</button>
    </div>
  </div>
</div>

<button class="admin-link" onclick="toggleAdmin()">Vista de administrador</button>

<div class="card hidden" id="admin-login">
  <span class="label">Acceso de administrador</span>
  <input type="password" id="pwdInput" placeholder="Contraseña">
  <p class="err" id="pwd-err">Contraseña incorrecta.</p>
  <button class="btn" onclick="adminLogin()">Ingresar</button>
</div>

<div class="card hidden" id="admin-panel">
  <span class="label">Panel de registros</span>
  <div class="stats" id="stats-row"></div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>#</th><th>Horario</th><th>Nombre</th><th>Estado</th><th></th></tr></thead>
      <tbody id="adminTable"></tbody>
    </table>
  </div>
</div>

</body>
</html>
